<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0"> <!-- displays site properly based on user's device -->

  <link rel="icon" type="image/png" sizes="32x32" href="./assets/images/favicon-32x32.png">
  
  <title>Frontend Mentor | Product list with cart</title>
  <link rel="stylesheet" href="style.css">

</head>
<body>

  <main>
    <section id="menu">
      <h1>Desserts</h1>
      <div id="container-grid">
        <!-- HTML gerado pelo JS -->
      </div>
    </section>
    <!-- CART------------------------------- -->
    <section id="cart-section">
      <div id="cart">
          <h2>Your Cart (<span id="cart-counter">0</span>)</h2>
          <img id="empty-cart-img" src="assets/images/illustration-empty-cart.svg" alt="">
          <p id="empty-cart-p">Your added items will appear here</p>
      </div>

      <div id="cart-div">
        <div class="cart-product-item">
        </div>
      </div>

      <div id="confirm-order">
        <div id="order-total">
          <p>Order total</p>
          <span><strong id="order-final-price">$46.50</strong></span>
        </div>
        <div id="carbon-neutral">
          <div id="carbon-neutral-info">
            <img src="assets/images/icon-carbon-neutral.svg" alt="">
            <p>
              This is a <strong>carbon-neutral</strong> delivery
            </p>
          </div>
          <button>confirm-order</button>
        </div>
      </div>
    </section>
  </main>

  <footer class="attribution">
    <p>
      Challenge by <a href="https://www.frontendmentor.io?ref=challenge" target="_blank">Frontend Mentor</a>.
      Coded by <a href="https://github.com/Princesval" target="_blank">João Vitor Princesval Caetano</a>.
    </p>
  </footer>
  <script src="index.js"></script>
</body>
</html>
